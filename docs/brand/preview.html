<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;padding:32px;background:#e9e8ef;font-family:'Microsoft YaHei UI',sans-serif;width:1376px}
h3{margin:18px 0 8px;font-size:15px;color:#333}
.row{display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap}
.cell{text-align:center;font-size:11px;color:#666}
.dark{background:#15151F;padding:16px;border-radius:12px}
.light{background:#FAF9F5;padding:16px;border-radius:12px}
img{display:block}
</style></head><body>
<h3>App icon（1024 源）在常见尺寸</h3>
<div class="row">
  <div class="cell"><img src="storyalter-icon.svg" width="256"><br>256</div>
  <div class="cell"><img src="storyalter-icon.svg" width="128"><br>128</div>
  <div class="cell"><img src="storyalter-icon.svg" width="64"><br>64</div>
  <div class="cell"><img src="storyalter-icon-small.svg" width="48"><br>48 small</div>
  <div class="cell"><img src="storyalter-icon-small.svg" width="32"><br>32 small</div>
  <div class="cell"><img src="storyalter-icon-small.svg" width="16"><br>16 small</div>
  <div class="cell"><img src="storyalter-icon.svg" width="32"><br>32 full</div>
  <div class="cell"><img src="storyalter-icon.svg" width="16"><br>16 full</div>
</div>
<h3>组合标</h3>
<div class="row">
  <img src="storyalter-lockup-dark.svg" width="600">
  <img src="storyalter-lockup-light.svg" width="600">
</div>
<h3>纯符号 / 单色</h3>
<div class="row">
  <div class="dark"><img src="storyalter-symbol.svg" width="160"></div>
  <div class="light"><img src="storyalter-symbol.svg" width="160"></div>
  <div class="dark"><img src="storyalter-symbol-mono-white.svg" width="160"></div><div class="light"><img src="storyalter-symbol-mono-ink.svg" width="160"></div>
</div>
</body></html>
